# Reference quote-based crossover, paper mode only.
fast = 3
slow = 5
max_spread_rupees = 2
max_age_seconds = 10
max_entries = 20

# Native strategy may enter a short while flat; BUY then covers that short.
enable_short = true

# Rupees per barrel from average entry, evaluated on executable bid/ask ticks.
stop_loss_rupees = 30
target_rupees = 60
