[workspace]
members = ["crates/kite-adapter", "apps/kite-node", "crates/kite-journal", "crates/kite-execution"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.98.0"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
nautilus-common = { version = "=0.63.0", default-features = false, features = ["live"] }
nautilus-core = { version = "=0.63.0", default-features = false }
nautilus-data = { version = "=0.63.0", default-features = false }
async-trait = "0.1"
parquet = { version = "56.2", default-features = false, features = ["snap"] }
nautilus-model = { version = "=0.63.0", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
redis = { version = "0.32", default-features = false, features = ["tls-rustls"] }
zeroize = "1"
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "signal"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", features = ["sink"] }

nautilus-execution = { version = "=0.63.0", default-features = false }

nautilus-trading = { version = "=0.63.0", default-features = false }
nautilus-risk = { version = "=0.63.0", default-features = false }
nautilus-portfolio = { version = "=0.63.0", default-features = false }

nautilus-live = { version = "=0.63.0", default-features = false, features = ["node"] }

nautilus-backtest = { version = "=0.63.0", default-features = false, features = ["streaming"] }

nautilus-system = { version = "=0.63.0", default-features = false }

nautilus-indicators = { version = "=0.63.0", default-features = false }

nautilus-analysis = { version = "=0.63.0", default-features = false }

nautilus-persistence = { version = "=0.63.0", default-features = false }

nautilus-infrastructure = { version = "=0.63.0", default-features = false, features = ["redis"] }

nautilus-sandbox = { version = "=0.63.0", default-features = false }

# Narrow integration fixes, documented in vendor/README.md.
[patch.crates-io]
nautilus-execution = { path = "vendor/nautilus-execution-0.63.0" }
nautilus-trading = { path = "vendor/nautilus-trading-0.63.0" }
