[workspace]
members = ["crates/kite-adapter", "apps/kite-node", "crates/kite-recorder"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.98.0"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
nautilus-common = { version = "=0.63.0", default-features = false, features = ["live"] }
nautilus-core = { version = "=0.63.0", default-features = false }
nautilus-data = { version = "=0.63.0", default-features = false }
async-trait = "0.1"
parquet = { version = "56.2", default-features = false, features = ["snap"] }
nautilus-model = { version = "=0.63.0", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
redis = { version = "0.32", default-features = false, features = ["tls-rustls"] }
zeroize = "1"
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "signal"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", features = ["sink"] }
