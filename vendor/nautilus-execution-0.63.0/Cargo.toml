[package]
edition = "2024"
rust-version = "1.98.0"
name = "nautilus-execution"
version = "0.63.0"
authors = ["Nautech Systems <info@nautechsystems.io>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Core execution machinery for the Nautilus trading engine"
homepage = "https://nautilustrader.io"
documentation = "https://nautilustrader.io/docs"
readme = "README.md"
keywords = [
    "finance",
    "trading",
    "trading-platform",
    "algorithmic-trading",
    "quantitative-finance",
]
categories = [
    "finance",
    "simulation",
    "asynchronous",
]
license = "LGPL-3.0-only"
repository = "https://github.com/nautechsystems/nautilus_trader"
resolver = "2"

[package.metadata.docs.rs]
features = [
    "high-precision",
    "simulation",
]
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[features]
default = []
extension-module = [
    "nautilus-common/extension-module",
    "nautilus-core/extension-module",
    "nautilus-model/extension-module",
    "python",
    "pyo3/extension-module",
]
high-precision = ["nautilus-model/high-precision"]
python = [
    "nautilus-common/python",
    "nautilus-core/python",
    "nautilus-model/python",
    "pyo3",
    "pyo3-stub-gen",
]
simulation = [
    "dep:madsim",
    "nautilus-core/simulation",
]

[lib]
name = "nautilus_execution"
crate-type = ["rlib"]
path = "src/lib.rs"

[[test]]
name = "exec_engine"
path = "tests/exec_engine.rs"

[[test]]
name = "matching_engine"
path = "tests/matching_engine.rs"

[[test]]
name = "order_emulator"
path = "tests/order_emulator.rs"

[[bench]]
name = "matching_core"
path = "benches/matching_core.rs"
harness = false

[[bench]]
name = "matching_engine"
path = "benches/matching_engine.rs"
harness = false

[dependencies.ahash]
