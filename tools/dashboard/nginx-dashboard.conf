# nginx-dashboard.conf v1.0.1
# nautilas.awsgoswami.com -> Streamlit dashboard on 127.0.0.1:8501, behind a password
# (HTTP basic auth, users in /etc/nginx/dashboard.htpasswd). Streamlit itself is never
# exposed. `certbot --nginx -d nautilas.awsgoswami.com` adds the HTTPS (443) block and the
# HTTP -> HTTPS redirect to this file. Setup: tools/dashboard/README.md.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name nautilas.awsgoswami.com;

    auth_basic           "Kite bot dashboard";
    auth_basic_user_file /etc/nginx/dashboard.htpasswd;

    location / {
        proxy_pass         http://127.0.0.1:8501;
        proxy_http_version 1.1;
        # Streamlit's live updates run over a WebSocket
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_buffering    off;
    }
}
